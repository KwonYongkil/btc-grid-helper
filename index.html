<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BTC GRID ANALYZER</title>

<style>

body{
background:#0f172a;
color:#e5e7eb;
font-family:-apple-system,BlinkMacSystemFont;
padding:14px;
}

h1{
text-align:center;
font-size:24px;
margin-bottom:4px;
}

.version{
text-align:center;
color:#94a3b8;
font-size:12px;
margin-bottom:14px;
}

.card{
background:#1e293b;
padding:16px;
border-radius:12px;
margin-bottom:12px;
}

.price{
font-size:28px;
font-weight:bold;
color:#22c55e;
}

.section-title{
font-size:12px;
color:#94a3b8;
margin-bottom:6px;
}

.value{
font-size:16px;
font-weight:600;
}

.grid{
font-size:16px;
line-height:1.7;
}

.market{
font-size:15px;
font-weight:600;
}

button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#22c55e;
font-size:16px;
font-weight:bold;
color:#052e16;
margin-bottom:12px;
}

iframe{
border-radius:10px;
}

</style>

</head>

<body>

<h1>BTC GRID ANALYZER</h1>
<div class="version" id="version"></div>

<div class="card">

<div class="section-title">현재 가격</div>
<div class="price" id="price">-</div>

<div class="section-title">시장 상태</div>
<div class="market" id="market">-</div>

<div class="section-title">RSI</div>
<div class="market" id="rsi">-</div>

<div class="section-title">현재 위치</div>
<div class="market" id="position">-</div>

<div class="section-title">눌림 확률</div>
<div class="market" id="pullprob">-</div>

<div class="section-title">상승 확률</div>
<div class="market" id="riseprob">-</div>

</div>


<button onclick="analyze()">시장 분석</button>


<div class="card">
<div class="section-title">추세</div>
<div class="market" id="trend">-</div>

<div class="section-title">최근 범위</div>
<div class="value" id="range">-</div>
</div>


<div class="card">
<div class="section-title">Bollinger Band</div>
<div class="value" id="bb">-</div>
</div>


<div class="card">
<div class="section-title">매물대</div>
<div class="value" id="levels">-</div>
</div>


<div class="card">
<div class="section-title">눌림 예상</div>
<div class="value" id="pullback">-</div>
</div>


<div class="card">
<div class="section-title">숏 거미줄</div>
<div class="grid" id="grid">-</div>
</div>


<div class="card">
<div class="section-title">TradingView Chart</div>

<iframe
width="100%"
height="400"
src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&interval=15&theme=dark"
></iframe>

</div>


<script>

/* 버전 */

const APP_VERSION="v9"

document.getElementById("version").innerText=
"Version "+APP_VERSION



async function analyze(){

/* 가격 */

let res=await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDC"
)

let data=await res.json()

let price=parseFloat(data.price)

document.getElementById("price").innerText=
price.toFixed(2)



/* 캔들 */

let k=await fetch(
"https://api.binance.com/api/v3/klines?symbol=BTCUSDC&interval=1h&limit=20"
)

let candles=await k.json()

let closes=candles.map(c=>parseFloat(c[4]))
let highs=candles.map(c=>parseFloat(c[2]))
let lows=candles.map(c=>parseFloat(c[3]))



/* MA */

let sum=closes.reduce((a,b)=>a+b,0)
let ma=sum/closes.length



/* 표준편차 */

let variance=closes.reduce((a,b)=>a+Math.pow(b-ma,2),0)/closes.length
let sd=Math.sqrt(variance)



/* Bollinger */

let bb_upper=ma+2*sd
let bb_lower=ma-2*sd

document.getElementById("bb").innerHTML=

`
Upper ${bb_upper.toFixed(0)}<br>
Middle ${ma.toFixed(0)}<br>
Lower ${bb_lower.toFixed(0)}
`



/* RSI */

let gains=0
let losses=0

for(let i=1;i<closes.length;i++){

let diff=closes[i]-closes[i-1]

if(diff>0) gains+=diff
else losses-=diff

}

let rs=gains/losses
let rsi=100-(100/(1+rs))

document.getElementById("rsi").innerText=rsi.toFixed(1)



/* 위치 */

let position="중립"

if(price>bb_upper)
position="BB Upper 위"

else if(price>ma)
position="BB Upper~Middle"

else if(price>bb_lower)
position="BB Middle~Lower"

else
position="BB Lower 아래"

document.getElementById("position").innerText=position



/* 매물대 */

let resistance=Math.max(...highs)
let support=Math.min(...lows)

document.getElementById("levels").innerHTML=

`
저항 ${resistance.toFixed(0)}<br>
지지 ${support.toFixed(0)}
`



/* 최근 범위 */

document.getElementById("range").innerHTML=

`
최근 고점 ${resistance.toFixed(0)}<br>
최근 저점 ${support.toFixed(0)}
`



/* 추세 */

let trend="조정"

if(price>ma && rsi>55)
trend="상승 추세"

else if(price<ma && rsi<45)
trend="하락 추세"

document.getElementById("trend").innerText=trend



/* 눌림 */

let pull1=ma
let pull2=support
let pull3=bb_lower

document.getElementById("pullback").innerHTML=

`
1차 눌림 ${pull1.toFixed(0)}<br>
2차 눌림 ${pull2.toFixed(0)}<br>
최대 눌림 ${pull3.toFixed(0)}
`



/* 확률 */

let pullProb="50%"
let riseProb="50%"

if(price>bb_upper){

pullProb="80%"
riseProb="20%"

}

else if(price>ma){

pullProb="60%"
riseProb="40%"

}

else{

pullProb="40%"
riseProb="60%"

}

document.getElementById("pullprob").innerText=pullProb
document.getElementById("riseprob").innerText=riseProb



/* 거미줄 */

let grid=[

price+200,
price+500,
price+900,
price+1400,
price+2000

]

let qty=[4,5,6,6,7]

let html=""

for(let i=0;i<grid.length;i++){

html+=grid[i].toFixed(0)+" → "+qty[i]+"<br>"

}

document.getElementById("grid").innerHTML=html

}

</script>

</body>
</html>
