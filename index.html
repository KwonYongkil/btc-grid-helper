<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BTC Grid Analyzer</title>

<style>

body{
background:#0f172a;
color:white;
font-family:sans-serif;
padding:15px;
}

h2{
text-align:center;
}

.card{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-bottom:12px;
}

button{
width:100%;
padding:15px;
border-radius:10px;
border:none;
background:#22c55e;
font-size:18px;
font-weight:bold;
}

.grid{
line-height:1.7;
}

</style>

</head>

<body>

<h2>BTC GRID ANALYZER</h2>

<div class="card">
현재 가격
<h3 id="price">-</h3>
</div>

<div class="card">
시장 상태
<div id="market">-</div>
</div>

<div class="card">
매물대
<div id="levels">-</div>
</div>

<div class="card">
숏 거미줄 (롱28 기준)
<div class="grid" id="grid">-</div>
</div>

<button onclick="analyze()">시장 분석 + 거미줄 계산</button>

<script>

async function analyze(){

let res = await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDC"
);

let data = await res.json();

let price = parseFloat(data.price);

document.getElementById("price").innerText =
price.toFixed(2);

let resistance1 = price + 300;
let resistance2 = price + 700;

let support1 = price - 300;
let support2 = price - 700;

document.getElementById("levels").innerHTML =

`
저항<br>
${resistance1.toFixed(0)}<br>
${resistance2.toFixed(0)}

<br>

지지<br>
${support1.toFixed(0)}<br>
${support2.toFixed(0)}
`;

let grid = [

price + 200,
price + 500,
price + 900,
price + 1400,
price + 2000

];

let qty = [4,5,6,6,7];

let html="";

for(let i=0;i<grid.length;i++){

html += grid[i].toFixed(0) +
" → " +
qty[i] +
"<br>";

}

document.getElementById("grid").innerHTML = html;

let market="중립";

if(price % 2 == 0){
market="상승 압력";
}else{
market="눌림 가능";
}

document.getElementById("market").innerText = market;

}

</script>

</body>

</html>
