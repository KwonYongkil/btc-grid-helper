<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Grid Analyzer</title>

<style>

body{
background:#0f172a;
color:#e5e7eb;
font-family:-apple-system,BlinkMacSystemFont;
padding:16px;
}

h1{
text-align:center;
font-size:26px;
margin-bottom:4px;
}

.version{
text-align:center;
color:#94a3b8;
font-size:13px;
margin-bottom:16px;
}

.card{
background:#1e293b;
padding:18px;
border-radius:14px;
margin-bottom:14px;
}

.price{
font-size:30px;
font-weight:bold;
color:#22c55e;
}

.market{
font-size:17px;
font-weight:600;
}

.section-title{
font-size:13px;
color:#94a3b8;
margin-bottom:8px;
}

.value{
font-size:18px;
font-weight:600;
}

.grid{
font-size:17px;
line-height:1.8;
}

button{
width:100%;
padding:16px;
border-radius:12px;
border:none;
background:#22c55e;
font-size:18px;
font-weight:bold;
color:#052e16;
margin-bottom:14px;
}

</style>

</head>

<body>

<h1>BTC GRID ANALYZER</h1>
<div class="version" id="version"></div>

<div class="card">

<div class="section-title">현재 가격</div>
<div class="price" id="price">-</div>

<div class="section-title">시장 상태</div>
<div class="market" id="market">-</div>

<div class="section-title">RSI</div>
<div class="market" id="rsi">-</div>

<div class="section-title">현재 위치</div>
<div class="market" id="position">-</div>

<div class="section-title">눌림 확률</div>
<div class="market" id="prob">-</div>

</div>

<button onclick="analyze()">시장 분석 + 거미줄 계산</button>

<div class="card">
<div class="section-title">매물대</div>
<div class="value" id="levels">-</div>
</div>

<div class="card">
<div class="section-title">눌림 예상</div>
<div class="value" id="pullback">-</div>
</div>

<div class="card">
<div class="section-title">숏 거미줄</div>
<div class="grid" id="grid">-</div>
</div>


<script>

/* 버전 */

let version = localStorage.getItem("app_version");

if(!version){
version = 1;
}else{
version = parseInt(version)+1;
}

localStorage.setItem("app_version",version);

document.getElementById("version").innerText="Version v"+version;



async function analyze(){

/* 가격 */

let res = await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDC"
);

let data = await res.json();

let price=parseFloat(data.price);

document.getElementById("price").innerText=price.toFixed(2);



/* 캔들 */

let k=await fetch(
"https://api.binance.com/api/v3/klines?symbol=BTCUSDC&interval=1h&limit=20"
);

let candles=await k.json();

let closes=candles.map(c=>parseFloat(c[4]));



/* MA */

let sum=closes.reduce((a,b)=>a+b,0);

let ma=sum/closes.length;



/* 표준편차 */

let variance=closes.reduce((a,b)=>a+Math.pow(b-ma,2),0)/closes.length;

let sd=Math.sqrt(variance);



/* Bollinger */

let bb_upper=ma+2*sd;

let bb_lower=ma-2*sd;



/* RSI */

let gains=0;
let losses=0;

for(let i=1;i<closes.length;i++){

let diff=closes[i]-closes[i-1];

if(diff>0) gains+=diff;
else losses-=diff;

}

let rs=gains/losses;

let rsi=100-(100/(1+rs));

document.getElementById("rsi").innerText=rsi.toFixed(1);



/* 현재 위치 */

let position="중립";

if(price>bb_upper) position="BB Upper 위";
else if(price>ma) position="BB Upper~Middle";
else if(price>bb_lower) position="BB Middle~Lower";
else position="BB Lower 아래";

document.getElementById("position").innerText=position;



/* 매물대 */

let resistance1=price+300;
let resistance2=price+700;

let support1=price-300;
let support2=price-700;

document.getElementById("levels").innerHTML=

`
저항<br>
${resistance1.toFixed(0)}<br>
${resistance2.toFixed(0)}

<br>

지지<br>
${support1.toFixed(0)}<br>
${support2.toFixed(0)}
`;



/* 눌림 */

let pull1=ma;
let pull2=support1;
let pull3=bb_lower;

document.getElementById("pullback").innerHTML=

`
1차 눌림 (MA20)<br>
${pull1.toFixed(0)}

<br>

2차 눌림 (매물대)<br>
${pull2.toFixed(0)}

<br>

최대 눌림 (BB Lower)<br>
${pull3.toFixed(0)}
`;



/* 눌림 확률 */

let prob="50%";

if(price>bb_upper) prob="80% 눌림 가능";
else if(price>ma) prob="60% 눌림 가능";
else prob="40% 눌림 가능";

document.getElementById("prob").innerText=prob;



/* 거미줄 */

let grid=[

price+200,
price+500,
price+900,
price+1400,
price+2000

];

let qty=[4,5,6,6,7];

let html="";

for(let i=0;i<grid.length;i++){

html+=grid[i].toFixed(0)+" → "+qty[i]+"<br>";

}

document.getElementById("grid").innerHTML=html;



/* 시장 상태 */

let market="중립";

if(rsi>75) market="단기 과열";
else if(rsi<35) market="반등 가능";
else market="상승 추세";

document.getElementById("market").innerText=market;

}

</script>

</body>
</html>
