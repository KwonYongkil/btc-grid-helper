<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BTC GRID ANALYZER</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

body{
background:#0f172a;
color:#e5e7eb;
font-family:-apple-system,BlinkMacSystemFont;
padding:12px;
}

h1{
text-align:center;
font-size:22px;
margin-bottom:4px;
}

.version{
text-align:center;
color:#94a3b8;
font-size:12px;
margin-bottom:10px;
}

.card{
background:#1e293b;
padding:14px;
border-radius:10px;
margin-bottom:10px;
}

.price{
font-size:26px;
font-weight:bold;
color:#22c55e;
}

.section-title{
font-size:12px;
color:#94a3b8;
}

.value{
font-size:15px;
font-weight:600;
}

button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#22c55e;
font-size:16px;
font-weight:bold;
color:#052e16;
margin-bottom:10px;
}

#chart{
height:320px;
}

</style>

</head>

<body>

<h1>BTC GRID ANALYZER</h1>
<div class="version">Version v10</div>

<div class="card">

<div class="section-title">현재 가격</div>
<div class="price" id="price">-</div>

<div class="section-title">RSI</div>
<div class="value" id="rsi">-</div>

<div class="section-title">추세</div>
<div class="value" id="trend">-</div>

</div>

<button onclick="analyze()">시장 분석</button>

<div class="card">

<div class="section-title">눌림 예상</div>
<div class="value" id="pullback">-</div>

</div>

<div id="chart"></div>

<script>

const chart = LightweightCharts.createChart(
document.getElementById('chart'),
{
layout:{
background:{color:'#0f172a'},
textColor:'#d1d5db'
},
grid:{
vertLines:{color:'#1e293b'},
horzLines:{color:'#1e293b'}
}
})

const lineSeries = chart.addLineSeries({
color:'#22c55e',
lineWidth:2
})


async function analyze(){

/* 가격 */

let priceRes = await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDC"
)

let priceData = await priceRes.json()

let price = parseFloat(priceData.price)

document.getElementById("price").innerText =
price.toFixed(2)



/* 캔들 */

let k = await fetch(
"https://api.binance.com/api/v3/klines?symbol=BTCUSDC&interval=15m&limit=100"
)

let candles = await k.json()

let closes = candles.map(c=>parseFloat(c[4]))
let highs = candles.map(c=>parseFloat(c[2]))
let lows = candles.map(c=>parseFloat(c[3]))



/* 차트 데이터 */

let chartData = candles.map(c=>({

time:c[0]/1000,
value:parseFloat(c[4])

}))

lineSeries.setData(chartData)



/* MA */

let sum = closes.slice(-20).reduce((a,b)=>a+b,0)
let ma = sum / 20



/* 표준편차 */

let variance =
closes.slice(-20).reduce((a,b)=>a+Math.pow(b-ma,2),0)/20

let sd = Math.sqrt(variance)



/* Bollinger */

let bbLower = ma - 2*sd



/* 지지 */

let support = Math.min(...lows.slice(-20))



/* RSI */

let gains=0
let losses=0

for(let i=1;i<closes.length;i++){

let diff=closes[i]-closes[i-1]

if(diff>0) gains+=diff
else losses-=diff

}

let rs=gains/losses

let rsi=100-(100/(1+rs))

document.getElementById("rsi").innerText=rsi.toFixed(1)



/* 추세 */

let trend="조정"

if(price>ma && rsi>55)
trend="상승"

else if(price<ma && rsi<45)
trend="하락"

document.getElementById("trend").innerText=trend



/* 눌림 */

let pull1=ma
let pull2=support
let pull3=bbLower

document.getElementById("pullback").innerHTML=

`
1차 ${pull1.toFixed(0)}<br>
2차 ${pull2.toFixed(0)}<br>
3차 ${pull3.toFixed(0)}
`



/* 수평선 표시 */

chart.addLineSeries({
color:'#fbbf24',
lineWidth:1
}).setData([
{time:chartData[0].time,value:pull1},
{time:chartData[chartData.length-1].time,value:pull1}
])

chart.addLineSeries({
color:'#f97316',
lineWidth:1
}).setData([
{time:chartData[0].time,value:pull2},
{time:chartData[chartData.length-1].time,value:pull2}
])

chart.addLineSeries({
color:'#ef4444',
lineWidth:1
}).setData([
{time:chartData[0].time,value:pull3},
{time:chartData[chartData.length-1].time,value:pull3}
])

}

</script>

</body>
</html>
