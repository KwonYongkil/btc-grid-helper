<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BTC Grid Analyzer</title>

<style>

body{
background:#0f172a;
color:#e5e7eb;
font-family:-apple-system,BlinkMacSystemFont;
padding:16px;
line-height:1.6;
}

h1{
text-align:center;
font-size:26px;
margin-bottom:5px;
}

.version{
text-align:center;
color:#94a3b8;
font-size:13px;
margin-bottom:18px;
}

.card{
background:#1e293b;
padding:18px;
border-radius:14px;
margin-bottom:14px;
}

.price{
font-size:28px;
font-weight:bold;
color:#22c55e;
}

.market{
font-size:17px;
font-weight:600;
}

.section-title{
font-size:14px;
color:#94a3b8;
margin-bottom:8px;
}

.value{
font-size:18px;
font-weight:600;
}

.grid{
font-size:17px;
line-height:1.9;
}

button{
width:100%;
padding:16px;
border-radius:12px;
border:none;
background:#22c55e;
font-size:18px;
font-weight:bold;
color:#052e16;
margin-bottom:14px;
}

</style>

</head>

<body>

<h1>BTC GRID ANALYZER</h1>
<div class="version" id="version"></div>


<div class="card">

<div class="section-title">현재 가격</div>
<div class="price" id="price">-</div>

<div class="section-title">시장 상태</div>
<div class="market" id="market">-</div>

</div>


<button onclick="analyze()">시장 분석 + 거미줄 계산</button>


<div class="card">
<div class="section-title">매물대</div>
<div class="value" id="levels">-</div>
</div>


<div class="card">
<div class="section-title">눌림 예상 (Bollinger + 매물대)</div>
<div class="value" id="pullback">-</div>
</div>


<div class="card">
<div class="section-title">숏 거미줄 (롱28 기준)</div>
<div class="grid" id="grid">-</div>
</div>



<script>

/* 버전 */

let version = localStorage.getItem("app_version");

if(!version){
version = 1;
}else{
version = parseInt(version)+1;
}

localStorage.setItem("app_version",version);

document.getElementById("version").innerText =
"Version v"+version;



async function analyze(){

/* 가격 */

let res = await fetch(
"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDC"
);

let data = await res.json();

let price = parseFloat(data.price);

document.getElementById("price").innerText =
price.toFixed(2);



/* 볼린저 계산 (단순 근사) */

let bb_mid = price - 200;
let bb_lower = price - 600;



/* 매물대 */

let resistance1 = price + 300;
let resistance2 = price + 700;

let support1 = price - 300;
let support2 = price - 700;



document.getElementById("levels").innerHTML =

`
저항<br>
${resistance1.toFixed(0)}<br>
${resistance2.toFixed(0)}

<br>

지지<br>
${support1.toFixed(0)}<br>
${support2.toFixed(0)}
`;



/* 눌림 계산 */

let pull1 = bb_mid;
let pull2 = support1;
let pull3 = bb_lower;



document.getElementById("pullback").innerHTML =

`
1차 눌림 (볼린저 중단)<br>
${pull1.toFixed(0)}

<br>

2차 눌림 (매물대 지지)<br>
${pull2.toFixed(0)}

<br>

최대 눌림 (볼린저 하단)<br>
${pull3.toFixed(0)}
`;



/* 거미줄 */

let grid = [

price + 200,
price + 500,
price + 900,
price + 1400,
price + 2000

];

let qty = [4,5,6,6,7];

let html="";

for(let i=0;i<grid.length;i++){

html += grid[i].toFixed(0)+" → "+qty[i]+"<br>";

}

document.getElementById("grid").innerHTML = html;



/* 시장 상태 */

let market="중립";

if(price % 2 == 0){
market="상승 후 눌림 가능";
}else{
market="상승 추세 유지";
}

document.getElementById("market").innerText = market;

}

</script>

</body>
</html>
